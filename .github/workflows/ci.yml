name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # Sem isto, o setup-node usa o Node 24 que estiver no cache do runner,
          # que pode estar atrás do último patch de segurança (em 2026-11-12 o
          # cache tinha a 24.22.2, e a correção era a 24.22.3).
          check-latest: true
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Compilar
        run: npm run compile

      - name: Testar
        run: npm test

      - name: Testar estado e contagem de tempo da bandeja
        run: npm run test:tray
