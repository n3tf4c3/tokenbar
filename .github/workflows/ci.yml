name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilar e testar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Compilar
        run: npm run compile

      - name: Testar
        run: npm test

      - name: Testar estado e contagem de tempo da bandeja
        run: npm run test:tray
